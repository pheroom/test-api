services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myapp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      WORKERS: ${WORKERS}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${APP_PORT:-8000}:8000"
    expose:
      - 8000
    volumes:
      - ./backend:/app
    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8000}/api/health"]
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - myapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.31-alpine
    container_name: myapp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
#      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - myapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  myapp_network:
    driver: bridge
