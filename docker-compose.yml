services:
  db:
    image: postgres:18-alpine
    container_name: myapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "-c password_encryption=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - myapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myapp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      WORKERS: ${WORKERS}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${APP_PORT:-8000}:8000"
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8000}/api/health"]
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - myapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-le:
    image: umputun/nginx-le:latest
    container_name: nginx-le
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=UTC
      - LETSENCRYPT=true
      - LE_EMAIL=webshtormthebest1@gmail.com
      - LE_FQDN=dvpsdmn834.work.gd,www.dvpsdmn834.work.gd
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/service.conf:ro
      - ./data/ssl:/etc/nginx/ssl
      - ./data/letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - myapp_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  certbot-etc:
  certbot-var:
  db_data:
    driver: local

networks:
  myapp_network:
    driver: bridge
